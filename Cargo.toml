[package]
name = "vastai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Unofficial async Rust client for the vast.ai REST API"
repository = "https://github.com/safewords/rs-vastai-sdk"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
